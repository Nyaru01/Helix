name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Prepare bundled NCBI BLAST+
        shell: pwsh
        run: ./prepare-blast.ps1
      - name: Test
        run: dotnet test LocalBlast.Tests/LocalBlast.Tests.csproj --configuration Release
      - name: Publish portable application
        run: dotnet publish LocalBlast.Wpf.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/HelixBlast
      - uses: actions/upload-artifact@v4
        with:
          name: HelixBlast-win-x64
          path: artifacts/HelixBlast/
          if-no-files-found: error
